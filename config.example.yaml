server:
  port: 8080
  read_timeout: 30s
  write_timeout: 300s

auth:
  keys:
    - key: sk-gateway-dev
      app_id: app-demo
      models:
        - gpt-4o
        - gpt-4o-mini
        - claude-sonnet-4

rate_limit:
  app-demo:
    qps: 100
    rpm: 6000

providers:
  - id: openai-main
    type: openai
    base_url: https://api.openai.com
    api_key: ${OPENAI_API_KEY}
    models:
      - gpt-4o
      - gpt-4o-mini

  - id: claude-main
    type: anthropic
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}
    models:
      - claude-sonnet-4

routes:
  - app_id: app-demo
    model: gpt-4o
    providers:
      - provider_id: openai-main
        weight: 100

  - app_id: app-demo
    model: claude-sonnet-4
    providers:
      - provider_id: claude-main
        weight: 100